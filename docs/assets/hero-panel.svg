<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-labelledby="t d">
<title id="t">SigScout</title>
<desc id="d">A field of candidate sequences. Larger filled markers are measured anchors - three high performers, two medium, two low. Ringed candidates form the next panel: several drawn from near the high anchors, several from empty regions far from everything already chosen, and one deliberately taken from beside a low-performing anchor as a control.</desc>
<style>
  .bg{fill:#ffffff}
  .fr{fill:none;stroke:#d8d5cc;stroke-width:1.5}
  .dot{fill:#dcd9d1}
  .hi{fill:#0F766E}
  .mid{fill:#9FE1CB}
  .lo{fill:#BA7517}
  .rhi{fill:none;stroke:#0F766E;stroke-width:2}
  .rdiv{fill:none;stroke:#8b8b85;stroke-width:2;stroke-dasharray:4 3}
  .rlo{fill:none;stroke:#BA7517;stroke-width:2}
  @media (prefers-color-scheme:dark){
    .bg{fill:#0d1117} .fr{stroke:#3a3d44} .dot{fill:#2e3138}
    .hi{fill:#2fa88f} .mid{fill:#1d7a68} .lo{fill:#EF9F27}
    .rhi{stroke:#2fa88f} .rdiv{stroke:#8b8b85} .rlo{stroke:#EF9F27}
  }
</style>
<rect class="bg" x="0" y="0" width="1000" height="250"/>
